name = "atlas"
version = "1.0.0"
target = "javascript"

# Fill out these fields if you intend to generate HTML documentation or publish
# your project to the Hex package manager.
#
# description = ""
# licences = ["Apache-2.0"]
# repository = { type = "github", user = "", repo = "" }
# links = [{ title = "Website", href = "" }]
#
# For a full reference of all the available options, you can have a look at
# https://gleam.run/writing-gleam/gleam-toml/.

[dependencies]
gleam_stdlib = ">= 1.0.0 and < 2.0.0"
lustre = ">= 5.7.1 and < 6.0.0"
modem = ">= 2.1.3 and < 3.0.0"
gleam_json = ">= 3.1.0 and < 4.0.0"

[dev_dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
lustre_dev_tools = ">= 2.4.0 and < 3.0.0"

[tools.lustre.html]
lang = "en"
title = "Atlas"
meta = [
  # The Material 3 surface color of each scheme (ADR 0044, 0045), so the browser's bar blends into the app bar.
  { name = "theme-color", content = "#fef7ff", media = "(prefers-color-scheme: light)" },
  { name = "theme-color", content = "#141218", media = "(prefers-color-scheme: dark)" },
  { name = "description", content = "Plan, share and review your running training." },
]
links = [
  { rel = "manifest", href = "/manifest.json" },
  { rel = "icon", href = "/icon.svg", type = "image/svg+xml" },
]
stylesheets = [
  { href = "/app.css" },
]

# `gleam run -m lustre/dev start` serves the app on its own port; API calls go to PocketBase.
[tools.lustre.dev.proxy]
from = "/api"
to = "http://127.0.0.1:8090/api"
